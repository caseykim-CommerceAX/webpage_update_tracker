name: Diagnose and deploy dashboard

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * *"
      timezone: "Asia/Seoul"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run scheduled or manual diagnosis
        if: github.event_name != 'push'
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            npm run scan -- --source schedule
          else
            npm run scan
          fi

      - name: Commit diagnostic JSON
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No diagnostic changes to commit."
          else
            git commit -m "data: record daily webpage diagnosis"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set GitHub Pages base path
        shell: bash
        run: |
          if [ "${{ github.event.repository.name }}" = "${{ github.repository_owner }}.github.io" ]; then
            echo "PAGES_BASE_PATH=" >> "$GITHUB_ENV"
          else
            echo "PAGES_BASE_PATH=/${{ github.event.repository.name }}" >> "$GITHUB_ENV"
          fi

      - name: Build static dashboard
        env:
          NEXT_PUBLIC_GITHUB_REPOSITORY_URL: https://github.com/${{ github.repository }}
        run: npm run build

      - name: Preserve Next.js assets
        run: touch out/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
